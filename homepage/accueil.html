<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO ──────────────────────────────────────────────── -->
  <title>bang. — Montres automatiques sur mesure | Atelier à Dissay, près de Poitiers</title>
  <meta name="description" content="Atelier français de montres automatiques sur mesure à Dissay (86), près de Poitiers. Configurez votre pièce unique et obtenez une estimation de prix en 2 minutes." />
  <link rel="canonical" href="https://atelier-bang.com/" />

  <!-- Open Graph / partage social -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="bang." />
  <meta property="og:title" content="bang. — Montres automatiques sur mesure" />
  <meta property="og:description" content="Nous ne produisons pas de série. Nous créons votre pièce unique. Atelier français à Dissay, près de Poitiers." />
  <meta property="og:url" content="https://atelier-bang.com/" />
  <meta property="og:image" content="https://atelier-bang.com/wp-content/uploads/2026/01/Untitled-design-3.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Polices : chargées UNE SEULE FOIS pour toute la page -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Design tokens : source unique de la charte visuelle -->
  <link rel="stylesheet" href="shared/bang-tokens.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bang-bg-deep, #0a0a0a); font-family: var(--bang-font, 'League Spartan', sans-serif); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  </style>

  <!-- ── Données structurées (SEO local) ──────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "bang.",
    "description": "Atelier français de montres automatiques sur mesure.",
    "url": "https://atelier-bang.com/",
    "image": "https://atelier-bang.com/wp-content/uploads/2025/10/LOGO-FRENG-2-1.png",
    "priceRange": "320€ - 950€+",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Dissay",
      "postalCode": "86130",
      "addressRegion": "Nouvelle-Aquitaine",
      "addressCountry": "FR"
    },
    "areaServed": "Poitiers et France entière",
    "makesOffer": {
      "@type": "Offer",
      "itemOffered": { "@type": "Product", "name": "Montre automatique sur mesure" }
    }
  }
  </script>
</head>
<body>

  <!-- Les 7 blocs sont injectés ici depuis homepage/sections/ (aucune duplication) -->
  <div data-include="sections/01-hero.html"></div>
  <div data-include="sections/02-indicateurs.html"></div>
  <div data-include="sections/03-gammes.html"></div>
  <div data-include="sections/04-teaser-simulateur.html"></div>
  <div data-include="sections/05-disponibilites.html"></div>
  <div data-include="sections/06-portfolio.html"></div>
  <div data-include="sections/07-process.html"></div>

  <!-- Inclusion des blocs (preview locale / Vercel). En WordPress, on colle
       directement chaque fichier de sections/ dans son bloc WPBakery. -->
  <script>
    (async function () {
      var nodes = document.querySelectorAll('[data-include]');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        try {
          var res = await fetch(el.getAttribute('data-include'));
          if (res.ok) {
            var html = await res.text();
            var range = document.createRange();
            var frag = range.createContextualFragment(html); // exécute aussi les <script> des blocs
            el.replaceWith(frag);
          }
        } catch (e) {
          console.warn('Inclusion impossible :', el.getAttribute('data-include'), e);
        }
      }
      // Une fois les blocs injectés, on charge la logique des créneaux (source unique)
      var s = document.createElement('script');
      s.src = 'shared/bang-creneaux.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
