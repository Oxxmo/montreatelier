<!-- ============================================================
     bang. — BLOC 5 : DISPONIBILITÉS ATELIER (rareté)
     Bloc HTML personnalisé WPBakery.
     NB : alimenté par shared/bang-creneaux.js (chargé une seule fois).
     ============================================================ -->
<style>
    .scarcity-section {
        font-family: var(--bang-font, 'League Spartan', sans-serif);
        background: transparent;
        color: #E8E8E8;
        padding: 80px 0 120px 0;
        width: 100%;
        margin: 0 auto;
        text-align: center;
        position: relative;
    }

    @keyframes scFadeInScale { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .status-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(var(--bang-gold-rgb, 201,169,110), 0.15);
        max-width: 900px; width: 90%; margin: 0 auto; padding: 60px 50px; position: relative;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        animation: scFadeInScale 0.8s ease-out;
    }

    .status-card::before {
        content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px;
        background: linear-gradient(45deg, transparent 30%, rgba(var(--bang-gold-rgb, 201,169,110), 0.3) 50%, transparent 70%);
        background-size: 200% 200%; animation: scBorderShine 6s ease infinite; z-index: -1; opacity: 0; transition: opacity 0.5s;
    }
    .status-card:hover::before { opacity: 1; }
    @keyframes scBorderShine { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .status-header { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 45px; padding-bottom: 25px; position: relative; }
    .status-header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--bang-gold-rgb, 201,169,110), 0.3) 50%, transparent); }

    .live-dot { width: 14px; height: 14px; background-color: #4CAF50; border-radius: 50%; box-shadow: 0 0 0 0 rgba(76,175,80,0.7), 0 0 15px rgba(76,175,80,0.5); animation: scPulseDot 2s infinite; position: relative; }
    @keyframes scPulseDot { 0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7), 0 0 15px rgba(76,175,80,0.5); } 50% { box-shadow: 0 0 0 8px rgba(76,175,80,0), 0 0 20px rgba(76,175,80,0.7); } 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0), 0 0 15px rgba(76,175,80,0.5); } }

    #current-month-display { font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: var(--bang-gold, #c9a96e); opacity: 0; animation: scFadeIn 0.8s ease 0.3s forwards; }
    @keyframes scFadeIn { to { opacity: 1; } }

    .slots-container { margin-bottom: 45px; position: relative; }
    .slots-number { font-size: 110px; font-weight: 700; line-height: 1; color: #FFFFFF; display: block; margin-bottom: 15px; letter-spacing: -2px; opacity: 0; animation: scFadeInScale 0.8s ease 0.5s forwards; transition: all 0.4s ease; }
    .slots-number.counting { animation: scCountPulse 0.3s ease; }
    @keyframes scCountPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .slots-label { font-size: 16px; text-transform: uppercase; color: #9B9B9B; letter-spacing: 3px; font-weight: 500; opacity: 0; animation: scFadeIn 0.8s ease 0.7s forwards; }

    .capacity-bar-container { margin: 0 auto 35px auto; max-width: 600px; }
    .capacity-bar-bg { width: 100%; height: 6px; background-color: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; position: relative; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
    .capacity-bar-fill { height: 100%; background: linear-gradient(90deg, #4CAF50 0%, #66BB6A 100%); width: 0%; transition: width 1.5s cubic-bezier(0.4,0,0.2,1); position: relative; box-shadow: 0 0 10px rgba(76,175,80,0.5); }
    .capacity-bar-fill::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: scBarShine 2s ease-in-out infinite; }
    @keyframes scBarShine { 0% { left: -100%; } 100% { left: 200%; } }
    .capacity-bar-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: #6B6B6B; letter-spacing: 1px; text-transform: uppercase; }

    .status-footer { font-size: 13px; color: #7A7A7A; font-weight: 400; margin-bottom: 45px; letter-spacing: 0.5px; opacity: 0; animation: scFadeIn 0.8s ease 0.9s forwards; }

    .scarcity-cta-btn { display: inline-block; padding: 22px 70px; background: linear-gradient(135deg, #FFFFFF 0%, #F5F5F5 100%); color: #0A0C0F; font-weight: 700; font-size: 14px; text-transform: uppercase; text-decoration: none; letter-spacing: 2.5px; transition: all 0.4s cubic-bezier(0.4,0,0.2,1); border: 1px solid transparent; position: relative; overflow: hidden; opacity: 0; animation: scFadeInScale 0.8s ease 1.1s forwards; }
    .scarcity-cta-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(135deg, transparent, rgba(var(--bang-gold-rgb, 201,169,110), 0.3), transparent); transition: left 0.6s ease; }
    .scarcity-cta-btn:hover::before { left: 100%; }
    .scarcity-cta-btn:hover { background: linear-gradient(135deg, var(--bang-gold, #c9a96e) 0%, var(--bang-gold-light, #e8c98a) 100%); color: #FFFFFF; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(var(--bang-gold-rgb, 201,169,110), 0.3); }
    .scarcity-cta-btn span { position: relative; z-index: 1; }

    .status-card.urgent .live-dot { background-color: #FFC107; animation: scPulseUrgent 1.5s infinite; }
    @keyframes scPulseUrgent { 0%,100% { box-shadow: 0 0 0 0 rgba(255,193,7,0.7), 0 0 20px rgba(255,193,7,0.5); } 50% { box-shadow: 0 0 0 10px rgba(255,193,7,0), 0 0 25px rgba(255,193,7,0.7); } }
    .status-card.full .live-dot { background-color: #F44336; animation: scPulseFull 1s infinite; }
    @keyframes scPulseFull { 0%,100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.7), 0 0 20px rgba(244,67,54,0.6); } 50% { box-shadow: 0 0 0 10px rgba(244,67,54,0), 0 0 30px rgba(244,67,54,0.8); } }

    @media (max-width: 768px) {
        .scarcity-section { padding: 60px 0 80px 0; }
        .status-card { width: 92%; padding: 45px 30px; }
        .slots-number { font-size: 80px; }
        .scarcity-cta-btn { width: 100%; padding: 20px 0; }
        #current-month-display { font-size: 15px; letter-spacing: 2px; }
        .capacity-bar-container { max-width: 100%; }
    }
    @media (max-width: 480px) {
        .slots-number { font-size: 65px; }
        .status-card { padding: 40px 25px; }
    }
</style>

<section class="scarcity-section">
    <div class="status-card" id="status-card">
        <div class="status-header">
            <div class="live-dot" id="status-light"></div>
            <div id="current-month-display">CHARGEMENT...</div>
        </div>

        <div class="slots-container">
            <span class="slots-number" id="slots-left">0</span>
            <span class="slots-label">Créneaux Disponibles</span>
        </div>

        <div class="capacity-bar-container">
            <div class="capacity-bar-bg"><div class="capacity-bar-fill" id="capacity-fill"></div></div>
            <div class="capacity-bar-labels">
                <span>Capacité Atelier</span>
                <span id="capacity-text">0/7</span>
            </div>
        </div>

        <div class="status-footer">
            Capacité mensuelle limitée à <span id="total-capacity">7</span> projets horlogers
        </div>

        <a href="https://calendly.com/atelierbang/30min" class="scarcity-cta-btn">
            <span id="cta-text">RÉSERVER MON CRÉNEAU</span>
        </a>
    </div>
</section>
